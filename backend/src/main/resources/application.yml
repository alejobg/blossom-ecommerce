spring:
  application:
    name: ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
  autoconfigure:
    # Users come from the database via JWT; skip Boot's in-memory user with a generated password
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      # Base64 HMAC key (>= 256 bits). The default is for local development only: set JWT_SECRET elsewhere.
      secret: ${JWT_SECRET:aW9/yZfKSWYXm4mLE5Nq+xojeIbIbfQLTOV2J7E8OgK5Etagn7uoKe5kJSfm0hXo}
      expiration: ${JWT_EXPIRATION:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
